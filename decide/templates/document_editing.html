<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decide — Document</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Georgia, serif;
            background: #F7FAFC;
            color: #263238;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 3rem;
            color: #004D40;
            letter-spacing: 0.05em;
        }

        header p {
            margin-top: 0.5rem;
            color: #546E7A;
            font-size: 1.1rem;
        }

        .editor-wrapper {
            background: #fff;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }

        .editor-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #E0E0E0;
            font-size: 0.9rem;
            color: #546E7A;
        }

        .editor-meta .join-code {
            font-size: 1rem;
            letter-spacing: 0.15em;
            color: #004D40;
            font-weight: bold;
        }

        #editor {
            height: 480px;
            font-family: Georgia, serif;
            font-size: 1rem;
            border: none;
        }

        .ql-toolbar {
            border: none !important;
            border-bottom: 1px solid #E0E0E0 !important;
        }

        .ql-container {
            border: none !important;
            font-family: Georgia, serif;
            font-size: 1rem;
        }

        .editor-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid #E0E0E0;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-family: Georgia, serif;
            cursor: pointer;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background: #FFB300;
            color: #1A202C;
            font-weight: bold;
        }

        .btn-primary:hover { background: #D4AF37; }

        .btn-outline {
            background: transparent;
            color: #004D40;
            border: 2px solid #004D40;
            font-weight: bold;
        }

        .btn-outline:hover {
            background: #004D40;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Decide</h1>
        <p>Collaborative document review, made simple.</p>
    </header>

    <div class="editor-wrapper">

        <div class="editor-meta">
            <span>{{ writer.first_name }} {{ writer.last_name }} &mdash; Revision {{ revision }}</span>
            <span>Join code: <span class="join-code">{{ session.join_code }}</span></span>
        </div>

        <div id="editor">{{ document }}</div>

        <div class="editor-actions">
            <form id="save-form" action="{% url 'save_document' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="join_code" value="{{ session.join_code }}">
                <input type="hidden" name="content" id="save-content">
                <button type="submit" class="btn btn-outline">Save</button>
            </form>
            <form id="submit-form" action="{% url 'submit_document' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="join_code" value="{{ session.join_code }}">
                <input type="hidden" name="content" id="submit-content">
                <button type="submit" class="btn btn-primary">Submit for Review</button>
            </form>
        </div>

    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script>
        const quill = new Quill('#editor', { theme: 'snow' });

        document.getElementById('save-form').addEventListener('submit', function () {
            document.getElementById('save-content').value = quill.root.innerHTML;
        });

        document.getElementById('submit-form').addEventListener('submit', function () {
            document.getElementById('submit-content').value = quill.root.innerHTML;
        });
    </script>

</body>
</html>
