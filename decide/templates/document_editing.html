<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decide — Document</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Georgia, serif;
            background: #F7FAFC;
            color: #263238;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 3rem;
            color: #004D40;
            letter-spacing: 0.05em;
        }

        header h1 a {
            color: inherit;
            text-decoration: none;
        }

        header h1 a:hover { opacity: 0.8; }

        header p {
            margin-top: 0.5rem;
            color: #546E7A;
            font-size: 1.1rem;
        }

        .editor-wrapper {
            background: #fff;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }

        .editor-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #E0E0E0;
            font-size: 0.9rem;
            color: #546E7A;
        }

        .editor-meta .join-code {
            font-size: 1rem;
            letter-spacing: 0.15em;
            color: #004D40;
            font-weight: bold;
        }

        #editor {
            height: 320px;
            font-family: Georgia, serif;
            font-size: 1rem;
            border: none;
        }

        .ql-toolbar {
            border: none !important;
            border-bottom: 1px solid #E0E0E0 !important;
        }

        .ql-container {
            border: none !important;
            font-family: Georgia, serif;
            font-size: 1rem;
        }

        .editor-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid #E0E0E0;
        }

        /* Added a style for our status text notification */
        #status-message {
            font-family: Georgia, serif;
            font-size: 0.95rem;
            margin-right: auto; /* Pushes status to the left, buttons stay on the right */
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-family: Georgia, serif;
            cursor: pointer;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background: #FFB300;
            color: #1A202C;
            font-weight: bold;
        }

        .btn-primary:hover { background: #D4AF37; }

        .btn-outline {
            background: transparent;
            color: #004D40;
            border: 2px solid #004D40;
            font-weight: bold;
        }

        .btn-outline:hover {
            background: #004D40;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1><a href="{% url 'home' %}">Decide</a></h1>
        <p>Collaborative document review, made simple.</p>
    </header>

    <div class="editor-wrapper">

        <div class="editor-meta">
            <span>{{ writer.first_name }} {{ writer.last_name }} &mdash; Revision {{ revision }}</span>
            <span>Join code: <span class="join-code">{{ session.join_code }}</span></span>
        </div>

        <div id="editor"></div>

        <div class="editor-actions">
            <div id="status-message"></div>

            <form id="save-form" action="{% url 'save_document' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="join_code" value="{{ session.join_code }}">
                <input type="hidden" name="content" id="save-content">
                <button type="submit" class="btn btn-outline" id="save-btn">Save</button>
            </form>
            <form id="submit-form" action="{% url 'submit_document' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="join_code" value="{{ session.join_code }}">
                <input type="hidden" name="first_name" value="{{ writer.first_name }}">
                <input type="hidden" name="last_name" value="{{ writer.last_name }}">
                <input type="hidden" name="content" id="submit-content">
                <button type="submit" class="btn btn-primary">Submit for Review</button>
            </form>
        </div>

    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script>
        const quill = new Quill('#editor', { theme: 'snow' });
        quill.clipboard.dangerouslyPasteHTML('{{ document|escapejs }}');
        const statusMsg = document.getElementById('status-message');

        // --- UPDATED SAVE FORM LOGIC ---
        document.getElementById('save-form').addEventListener('submit', function (e) {
            e.preventDefault(); // <-- Stops the page from changing/refreshing
            
            statusMsg.style.color = '#546E7A';
            statusMsg.innerText = "Saving...";

            // 1. Put the Quill editor text into the hidden input
            const contentInput = document.getElementById('save-content');
            contentInput.value = quill.root.innerHTML;

            // 2. Send the form data to Django silently in the background
            fetch(this.action, {
                method: this.method,
                body: new FormData(this)
            })
            .then(response => {
                if (response.ok) {
                    statusMsg.style.color = '#004D40';
                    statusMsg.innerText = "✓ Draft saved";
                } else {
                    statusMsg.style.color = '#D32F2F';
                    statusMsg.innerText = "Error saving draft.";
                }
            })
            .catch(error => {
                statusMsg.style.color = '#D32F2F';
                statusMsg.innerText = "Network error.";
            });
        });

        // Leave your submit form exactly as it is (assuming you WANT it to redirect upon submission)
        document.getElementById('submit-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const content = quill.root.innerHTML;
            document.getElementById('submit-content').value = content;

            const saveData = new FormData(document.getElementById('save-form'));
            saveData.set('content', content);

            fetch("{% url 'save_document' %}", { method: 'POST', body: saveData })
                .then(() => this.submit());
        });
    </script>

</body>
</html>
